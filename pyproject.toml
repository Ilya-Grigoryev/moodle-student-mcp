[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "moodle-student-mcp"
version = "2.0.0"
description = "MCP server that gives an LLM read access to your Moodle: courses, deadlines, grades, files, forums, quizzes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ilia Grigorev" }]
keywords = ["mcp", "moodle", "lms", "education", "llm", "claude"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "markdownify>=1.1,<2",
    "pypdf>=5,<7",
    "resvg-py>=0.5,<1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Ilya-Grigoryev/moodle-student-mcp"

[project.scripts]
moodle-mcp = "moodle_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B905", "SIM105"]
